<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Data Dokter</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">
  <style>
    .card-header {
      background: linear-gradient(to bottom,rgb(135, 199, 231),rgb(5, 19, 121));
      color: white;
      font-weight: bold;
    }
modal-header

    table.dataTable thead th {
      background-color: #198754; /* Hijau Bootstrap */
      color: white;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
</head>
<body class="p-3">
<div class="container">
  <div class="card shadow">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Data Dokter</h4>
      <button class="btn btn-light" id="btnAdd">+ Tambah Dokter</button>
    </div>
    <div class="card-body">
      <table id="dokterTable" class="table table-bordered table-striped w-100">
        <thead>
          <tr>
            <th></th>
            <th>NIP</th>
            <th>Nama Dokter</th>
            <th>Jenis Kelamin</th>
            <th>Spesialis</th>
            <th>Aksi</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>
</div>

<!-- Modal Form -->
<div class="modal fade" id="dokterModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="dokterForm" enctype="multipart/form-data">
        <div class="modal-header">
          <h5 class="modal-title">Form Dokter</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="old_foto" name="old_foto">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>NIP Dokter</label>
              <input type="text" name="nip_dokter" id="nip_dokter" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label>Nama Dokter</label>
              <input type="text" name="nm_dokter" id="nm_dokter" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label>Jenis Kelamin</label>
              <select name="jenis_kelamin" id="jenis_kelamin" class="form-control">
                <option value="L">Laki-laki</option>
                <option value="P">Perempuan</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label>Spesialis</label>
              <select name="kd_spesialis" id="kd_spesialis" class="form-control">
                @each(sp in spesialis)
                  <option value="{{ sp.kd_spesialis }}">{{ sp.nm_spesialis }}</option>
                @endeach
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label>No. Telepon</label>
              <input type="text" name="no_telp" id="no_telp" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label>Tanggal Masuk</label>
              <input type="date" name="tgl_masuk" id="tgl_masuk" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label>Foto</label>
              <input type="file" name="foto" id="foto" class="form-control">
            </div>
            <div class="col-md-12 mb-3">
              <label>Alamat</label>
              <textarea name="alamat" id="alamat" class="form-control"></textarea>
            </div>
            <div class="col-md-12 mb-3">
              <label>Keterangan</label>
              <textarea name="keterangan" id="keterangan" class="form-control"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
$(function(){
  function format(row){
    return '<table class="table table-sm table-bordered">'+
      '<tr><th>Alamat</th><td>'+(row.alamat||'')+'</td></tr>'+
      '<tr><th>No. Telepon</th><td>'+(row.no_telp||'')+'</td></tr>'+
      '<tr><th>Tgl Masuk</th><td>'+(row.tgl_masuk||'')+'</td></tr>'+
      '<tr><th>Foto</th><td>'+(row.foto?'<img src="/uploads/'+row.foto+'" width="100">':'')+'</td></tr>'+
      '<tr><th>Keterangan</th><td>'+(row.keterangan||'')+'</td></tr>'+
      '</table>';
  }

  var table = $('#dokterTable').DataTable({
    ajax: '/admin/dokter/data',
    columns: [
      { data: null, className:'dt-control', orderable:false, defaultContent:'' },
      { data: 'nip_dokter' },
      { data: 'nm_dokter' },
      { data: 'jenis_kelamin' },
      { data: 'nm_spesialis' },
      { data: null, render: function(row){
          return '<button class="btn btn-sm btn-warning btnEdit" data-id="'+row.nip_dokter+'">Edit</button> '+
                 '<button class="btn btn-sm btn-danger btnDelete" data-id="'+row.nip_dokter+'">Hapus</button>';
        }
      }
    ]
  });

  $('#dokterTable tbody').on('click', 'td.dt-control', function () {
    var tr = $(this).closest('tr');
    var row = table.row(tr);
    if(row.child.isShown()) row.child.hide(); else row.child(format(row.data())).show();
  });

  $('#btnAdd').click(function(){
    $('#dokterForm')[0].reset();
    $('#nip_dokter').prop('disabled', false);
    $('#dokterModal').modal('show');
  });

  $('#dokterForm').submit(function(e){
    e.preventDefault();
    var formData = new FormData(this);
    var id = $('#nip_dokter').val();
    var isEdit = $('#nip_dokter').prop('disabled');

    $.ajax({
      url: isEdit ? '/admin/dokter/update/'+id : '/admin/dokter/store',
      method: 'POST',
      data: formData,
      processData: false,
      contentType: false,
      success: function(){
        $('#dokterModal').modal('hide');
        table.ajax.reload();
      }
    });
  });

  $('#dokterTable').on('click', '.btnEdit', function(){
    var row = table.row($(this).closest('tr')).data();
    $('#nip_dokter').val(row.nip_dokter).prop('disabled', true);
    $('#nm_dokter').val(row.nm_dokter);
    $('#jenis_kelamin').val(row.jenis_kelamin);
    $('#kd_spesialis').val(row.kd_spesialis);
    $('#alamat').val(row.alamat);
    $('#no_telp').val(row.no_telp);
    $('#tgl_masuk').val(row.tgl_masuk);
    $('#old_foto').val(row.foto);
    $('#keterangan').val(row.keterangan);
    $('#dokterModal').modal('show');
  });

  $('#dokterTable').on('click', '.btnDelete', function(){
    if(confirm('Yakin hapus data ini?')){
      $.ajax({
        url: '/admin/dokter/delete/'+$(this).data('id'),
        method: 'DELETE',
        success: function(){ table.ajax.reload(); }
      });
    }
  });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
