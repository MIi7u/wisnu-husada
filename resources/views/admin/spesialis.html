<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Data Spesialis</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css">
    <style>
     /* Styling untuk header tabel berwarna hijau */
    th {
       background: linear-gradient(to bottom,rgb(240, 208, 163),rgb(153, 97, 13)); /* Warna hijau */
       color: white; /* Warna teks putih */
    }
    </style>
</head>
<body>
<div class="container mt-5">
  <div class="card shadow-lg">
    <div class="card-header text-white d-flex justify-content-between align-items-center" style="background: linear-gradient(to top, #007bff, #00c6ff);">
      <h4 class="mb-0">Data Spesialis</h4>
       <button class="btn btn-success mb-3" id="btnAdd">Tambah Spesialis</button>
    </div>
    <div class="card-body">
         <table id="spesialisTable" class="table table-bordered table-striped w-100">
        <thead class="text-white" style="background: linear-gradient(to top, #007bff, #00c6ff);">
          <tr>
            <th>Kode</th>
            <th>Nama Spesialis</th>
            <th>Keterangan</th>
            <th>Aksi</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="spesialisModal" tabindex="-1">
  <div class="modal-dialog">
    <form id="spesialisForm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Form Spesialis</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="formType">
          <input type="hidden" id="spesialisId">
          <div class="mb-3">
            <label>Kode Spesialis</label>
            <input type="text" class="form-control" id="kd_spesialis" name="kd_spesialis" required>
          </div>
          <div class="mb-3">
            <label>Nama Spesialis</label>
            <input type="text" class="form-control" id="nm_spesialis" name="nm_spesialis" required>
          </div>
          <div class="mb-3">
            <label>Keterangan</label>
            <textarea class="form-control" id="keterangan" name="keterangan"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Simpan</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<script>
$(document).ready(function(){
  var table = $('#spesialisTable').DataTable({
    ajax: '/admin/spesialis/list',
    columns: [
      { data: 'kd_spesialis' },
      { data: 'nm_spesialis' },
      { data: 'keterangan' },
      { 
        data: null, 
        render: function(data){
          return '' +
            '<button class="btn btn-sm btn-warning btnEdit" data-id="' + data.kd_spesialis + '">Edit</button> ' +
            '<button class="btn btn-sm btn-danger btnDelete" data-id="' + data.kd_spesialis + '">Hapus</button>';
        }
      }
    ],
    order: [[1, 'asc']],
                dom: '<"row mb-2"' +
                    '<"col-sm-4"l>' +                 // Show entries (kiri)
                    '<"col-sm-4 text-center"B>' +     // Tombol export (tengah)
                    '<"col-sm-4"f>' +                 // Search box (kanan)
                    '>' +
                    '<"row"<"col-sm-12"tr>>' +           // Tabel
                    '<"row mt-2"' +
                    '<"col-sm-5"i>' +                 // Info
                    '<"col-sm-7"p>' +                 // Pagination
                    '>',
                buttons: [
                    { extend: 'excelHtml5', title: 'Data_Dokter_DPJP' },
                    { extend: 'pdfHtml5', title: 'Data_Dokter_DPJP' },
                ],
                language: {
                    url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/id.json"
                }
            });

  $('#btnAdd').click(function(){
    $('#spesialisForm')[0].reset();
    $('#formType').val('add');
    $('#kd_spesialis').prop('readonly', false);
    $('#spesialisModal').modal('show');
  });

  $('#spesialisTable').on('click', '.btnEdit', function(){
    var id = $(this).data('id');
    $.get('/admin/spesialis/list', function(res){
      var spesialis = res.data.find(function(item){ return item.kd_spesialis == id });
      $('#formType').val('edit');
      $('#spesialisId').val(id);
      $('#kd_spesialis').val(spesialis.kd_spesialis).prop('readonly', true);
      $('#nm_spesialis').val(spesialis.nm_spesialis);
      $('#keterangan').val(spesialis.keterangan);
      $('#spesialisModal').modal('show');
    });
  });

  $('#spesialisTable').on('click', '.btnDelete', function(){
    var id = $(this).data('id');
    if(confirm('Yakin hapus data ini?')){
      $.ajax({
        url: '/admin/spesialis/' + id,
        type: 'DELETE',
        success: function(res){
          alert(res.message);
          table.ajax.reload();
        }
      });
    }
  });

  $('#spesialisForm').submit(function(e){
    e.preventDefault();
    var type = $('#formType').val();
    var id = $('#spesialisId').val();
    var data = {
      kd_spesialis: $('#kd_spesialis').val(),
      nm_spesialis: $('#nm_spesialis').val(),
      keterangan: $('#keterangan').val()
    };
    if(type == 'add'){
      $.post('/admin/spesialis', data, function(res){
        alert(res.message);
        $('#spesialisModal').modal('hide');
        table.ajax.reload();
      });
    } else {
      $.ajax({
        url: '/admin/spesialis/' + id,
        type: 'PUT',
        data: data,
        success: function(res){
          alert(res.message);
          $('#spesialisModal').modal('hide');
          table.ajax.reload();
        }
      });
    }
  });
});
</script>
</body>
</html>
