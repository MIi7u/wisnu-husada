<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Manajemen Dokter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet">

  <style>
    .card-header {
      background: linear-gradient(to top, #0066ff, #00ccff);
      color: white;
    }
    #dokterTable thead {
      background: linear-gradient(to bottom, #00ccff, #0066ff);
      color: white;
    }
    #dokterTable thead th {
      border: none;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="container mt-4">

  <!-- Card -->
  <div class="card shadow-lg border-0 rounded-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">📋 Data Dokter</h5>
      <button class="btn btn-light btn-sm" id="btnAdd">➕ Tambah Dokter</button>
    </div>
    <div class="card-body">
      <table id="dokterTable" class="table table-bordered table-striped align-middle">
        <thead>
          <tr>
            <th style="width:30px;"></th>
            <th>NIP</th>
            <th>Nama Dokter</th>
            <th>Jenis Kelamin</th>
            <th>Kode Spesialis</th>
            <th>Nama Spesialis</th>
            <th style="width:120px;">Aksi</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal fade" id="dokterModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <!-- enctype untuk upload file -->
      <form id="dokterForm" enctype="multipart/form-data">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Form Dokter</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="nip_dokter" name="nip_dokter">
          <div class="mb-2">
            <label class="form-label">Nama Dokter</label>
            <input type="text" class="form-control" name="nm_dokter" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Jenis Kelamin</label>
            <select class="form-select" name="jenis_kelamin" required>
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Kode Spesialis</label>
            <input type="text" class="form-control" name="kd_spesialis" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Nama Spesialis</label>
            <input type="text" class="form-control" name="nm_spesialis" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Alamat</label>
            <textarea class="form-control" name="alamat"></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label">No Telp</label>
            <input type="text" class="form-control" name="no_telp">
          </div>
          <div class="mb-2">
            <label class="form-label">Tanggal Masuk</label>
            <input type="date" class="form-control" name="tgl_masuk">
          </div>
          <!-- Tambahan: input foto -->
          <div class="mb-2">
            <label class="form-label">Foto Dokter</label>
            <input type="file" class="form-control" name="foto" accept="image/*">
          </div>
          <div class="mb-2">
            <label class="form-label">Keterangan</label>
            <textarea class="form-control" name="keterangan"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">💾 Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Script -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(function() {
  var table = $('#dokterTable').DataTable({
    ajax: '/dokter/list',
    responsive: true,
    columns: [
      {
        className: 'dt-control',
        orderable: false,
        data: null,
        defaultContent: ''
      },
      { data: 'nip_dokter' },
      { data: 'nm_dokter' },
      { data: 'jenis_kelamin' },
      { data: 'kd_spesialis' },
      { data: 'nm_spesialis' },
      {
        data: null,
        render: function(data) {
          return '<button class="btn btn-sm btn-warning btnEdit" data-id="' + data.nip_dokter + '">✏️</button> ' +
                 '<button class="btn btn-sm btn-danger btnDelete" data-id="' + data.nip_dokter + '">🗑️</button>';
        }
      }
    ]
  });

  // Expand Row
  $('#dokterTable tbody').on('click', 'td.dt-control', function() {
    var tr = $(this).closest('tr');
    var row = table.row(tr);

    if (row.child.isShown()) {
      row.child.hide();
      tr.removeClass('shown');
    } else {
      var childHtml = '<div class="p-2">' +
        '<b>Alamat:</b> ' + (row.data().alamat || '') + '<br>' +
        '<b>No Telp:</b> ' + (row.data().no_telp || '') + '<br>' +
        '<b>Tanggal Masuk:</b> ' + (row.data().tgl_masuk || '') + '<br>' +
        '<b>Keterangan:</b> ' + (row.data().keterangan || '') + '<br>' +
        '<b>Foto:</b> ' + (row.data().foto ? '<img src="/uploads/' + row.data().foto + '" class="img-thumbnail" style="max-height:100px;">' : 'Belum ada foto') +
      '</div>';
      row.child(childHtml).show();
      tr.addClass('shown');
    }
  });

  // Tambah Dokter
  $('#btnAdd').click(function() {
    $('#dokterForm')[0].reset();
    $('#dokterModal').modal('show');
  });

  // Simpan Form (pakai FormData untuk handle file)
  $('#dokterForm').submit(function(e) {
    e.preventDefault();
    var formData = new FormData(this);
    $.ajax({
      url: '/dokter/store',
      type: 'POST',
      data: formData,
      processData: false,
      contentType: false,
      success: function() {
        $('#dokterModal').modal('hide');
        table.ajax.reload();
      }
    });
  });
});
</script>
</body>
</html>
