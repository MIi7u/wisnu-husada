<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Export Dua Tabel + Logo ke PDF</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    th {
      background-color: #007b5e;
      color: white;
    }
  </style>
</head>
<body>
<div class="container mt-4">
  <h4>Tabel Mahasiswa 1</h4>
  <table id="myTable1" class="display table table-bordered" style="width:100%">
    <thead>
      <tr><th>No</th><th>Nama</th><th>Jurusan</th><th>IPK</th></tr>
    </thead>
    <tbody>
      <tr><td>1</td><td>Ani</td><td>Informatika</td><td>3.8</td></tr>
      <tr><td>2</td><td>Budi</td><td>Sistem Informasi</td><td>3.5</td></tr>
    </tbody>
  </table>

  <h4 class="mt-5">Tabel Mahasiswa 2</h4>
  <table id="myTable2" class="display table table-bordered" style="width:100%">
    <thead>
      <tr><th>No</th><th>Nama</th><th>Jurusan</th><th>IPK</th></tr>
    </thead>
    <tbody>
      <tr><td>3</td><td>Citra</td><td>Teknik Komputer</td><td>3.7</td></tr>
      <tr><td>4</td><td>Dedi</td><td>Informatika</td><td>3.9</td></tr>
    </tbody>
  </table>

  <button class="btn btn-danger mt-4" onclick="exportAllTables()">Export Semua Tabel ke PDF</button>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="logo.js"></script> <!-- Import base64 logo di sini -->

<script>
  $(document).ready(function () {
    $('#myTable1').DataTable();
    $('#myTable2').DataTable();
  });

  function tableToPdfContent(tableId, title) {
    const table = document.querySelector(`#${tableId}`);
    const headers = [...table.querySelectorAll('thead th')].map(th => th.innerText);
    const rows = [...table.querySelectorAll('tbody tr')].map(tr =>
      [...tr.querySelectorAll('td')].map(td => td.innerText)
    );

    return [
      { text: title, style: 'header', margin: [0, 10, 0, 5] },
      {
        table: {
          headerRows: 1,
          widths: headers.map(() => '*'),
          body: [headers, ...rows]
        },
        layout: 'lightHorizontalLines'
      }
    ];
  }

  function exportAllTables() {
    const docDefinition = {
      content: [
        {
          columns: [
            {
              image: logoBase64, // Diambil dari logo.js
              width: 60
            },
            {
              stack: [
                { text: 'RUMAH SAKIT ISLAM PURWOKERTO', style: 'header', alignment: 'center' },
                { text: 'Jl. H. Masyhuri No. 39, Telp: +62 858-7503-5300', style: 'subheader', alignment: 'center' },
                { text: 'Email: rsislam.purwokerto@gmail.com', style: 'subheader', alignment: 'center' }
              
              ],
              width: '*',
              margin: [10, 0, 0, 0]
            }
          ],
          margin: [0, 0, 0, 10]
        },
        { canvas: [ { type: 'line', x1: 0, y1: 0, x2: 520, y2: 0, lineWidth: 1 } ], margin: [0, 10, 0, 10] },
        { text: 'RINCIAN RAWAT JALAN', style: 'judul', alignment: 'center', margin: [0, 0, 0, 20] },
        ...tableToPdfContent('myTable1', 'Data Rawat Jalan'),
        ...tableToPdfContent('myTable2', 'Data Rawat')
      ],
      styles: {
        header: {
          fontSize: 14,
          bold: true
        },
        subheader: {
          fontSize: 10
        },
        judul: {
          fontSize: 12,
          bold: true
        }
      },
      defaultStyle: {
        fontSize: 9
      }
    };

    pdfMake.createPdf(docDefinition).download('dua_tabel_dengan_logo.pdf');
  }
</script>
</body>
</html>
