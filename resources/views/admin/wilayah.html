<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Wilayah</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Select2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Select2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="mb-4 text-center">Form Pilih Wilayah</h1>

    <div class="card shadow-sm p-4">
      <form>
        <!-- Provinsi -->
        <div class="mb-3">
          <label for="provinsi" class="form-label">Provinsi</label>
          <select id="provinsi" class="form-select select2"></select>
        </div>

        <!-- Kabupaten -->
        <div class="mb-3">
          <label for="kabupaten" class="form-label">Kabupaten</label>
          <select id="kabupaten" class="form-select select2"></select>
        </div>

        <!-- Kecamatan -->
        <div class="mb-3">
          <label for="kecamatan" class="form-label">Kecamatan</label>
          <select id="kecamatan" class="form-select select2"></select>
        </div>

        <!-- Kelurahan -->
        <div class="mb-3">
          <label for="kelurahan" class="form-label">Kelurahan</label>
          <select id="kelurahan" class="form-select select2"></select>
        </div>
      </form>
    </div>
  </div>

  <script>
    $(document).ready(function(){
      // Inisialisasi Select2
      $('.select2').select2({
        theme: 'bootstrap-5',
        placeholder: 'Pilih...',
        allowClear: true
      });

      // Load Provinsi
      $.get('/wilayah/root', function(data){
        $('#provinsi').append('<option value="">-- Pilih Provinsi --</option>');
        data.forEach(item => {
          $('#provinsi').append(`<option value="${item.code}">${item.name}</option>`);
        });
      });

      // Event Provinsi -> Kabupaten
      $('#provinsi').change(function(){
        let code = $(this).val();
        $('#kabupaten').empty().append('<option value="">Loading...</option>');
        $('#kecamatan').empty().append('<option value="">-- Pilih Kecamatan --</option>');
        $('#kelurahan').empty().append('<option value="">-- Pilih Kelurahan --</option>');
        if(code){
          $.get(`/wilayah/${code}`, function(data){
            $('#kabupaten').empty().append('<option value="">-- Pilih Kabupaten --</option>');
            data.forEach(item => {
              $('#kabupaten').append(`<option value="${item.code}">${item.name}</option>`);
            });
          });
        }
      });

      // Event Kabupaten -> Kecamatan
      $('#kabupaten').change(function(){
        let code = $(this).val();
        $('#kecamatan').empty().append('<option value="">Loading...</option>');
        $('#kelurahan').empty().append('<option value="">-- Pilih Kelurahan --</option>');
        if(code){
          $.get(`/wilayah/${code}`, function(data){
            $('#kecamatan').empty().append('<option value="">-- Pilih Kecamatan --</option>');
            data.forEach(item => {
              $('#kecamatan').append(`<option value="${item.code}">${item.name}</option>`);
            });
          });
        }
      });

      // Event Kecamatan -> Kelurahan
      $('#kecamatan').change(function(){
        let code = $(this).val();
        $('#kelurahan').empty().append('<option value="">Loading...</option>');
        if(code){
          $.get(`/wilayah/${code}`, function(data){
            $('#kelurahan').empty().append('<option value="">-- Pilih Kelurahan --</option>');
            data.forEach(item => {
              $('#kelurahan').append(`<option value="${item.code}">${item.name}</option>`);
            });
          });
        }
      });
    });
  </script>
</body>
</html>
