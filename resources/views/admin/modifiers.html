<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>CRUD Modifiers</title>
  <meta name="csrf-token" content="{{ csrfToken }}">

 <!-- CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css">

  <style>
    body {
      background: url('/images/bg1.png') no-repeat center center fixed;
      background-size: cover;
    }
    .card-header {
      background: #0d6efd;
      color: #fff;
      font-weight: bold;
    }
    .modal-header {
      background: #198754;
      color: #fff;
    }
    table thead th {
      background: #0d6efd;
      color: #fff;
    }
    .modal-backdrop.show {
      background: url('https://images.unsplash.com/photo-1581092918367-1f4b7f3e1f7a') no-repeat center center/cover;
      opacity: 0.8;
    }
  </style></head>
<body>
<div class="container mt-5">
  <div class="card shadow-lg">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Manajemen Modifiers</h4>
      <button class="btn btn-success mb-3" id="btnAdd">Tambah Modifier</button>
    </div>
    <div class="card-body">
      <table id="modifiersTable" class="table table-bordered table-striped">
        <thead class="table-primary">
          <tr>
            <th>Code</th>
            <th>Kategori</th>
            <th>Kelompok Item</th>
            <th>Aksi</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modifierModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Tambah/Update Modifier</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="modifierForm">
          <div class="mb-3">
         
            <div class="input-group input-group-lg">
              <span class="input-group-text">Masukkan Code<i class="bi bi-upc-scan"></i></span>
              <input type="text" name="Code" id="Code" class="form-control"  required>
            </div>
          </div>
          <div class="mb-3">
         
            <div class="input-group input-group-lg">
              <span class="input-group-text">Masukkan Kategori<i class="bi bi-tags"></i></span>
              <input type="text" name="Kategori" id="Kategori" class="form-control"  required>
            </div>
          </div>
          <div class="mb-3">
           
            <div class="input-group input-group-lg">
              <span class="input-group-text"><i class="bi bi-box-seam">Masukkan Item</i></span>
              <input type="text" name="Kelompok_Item" id="Kelompok_Item" class="form-control"  required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Script -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.5/js/dataTables.bootstrap5.min.js"></script>

<script>
  $(function () {
    let table = $('#modifiersTable').DataTable({
      ajax: '/modifiers/data',
      columns: [
        { data: 'Code' },
        { data: 'Kategori' },
        { data: 'Kelompok_Item' },
        {
          data: null,
          render: function (data) {
            return '<button class="btn btn-warning btn-sm editBtn" data-code="' + data.Code + '">Edit</button>' +
                    ' <button class="btn btn-danger btn-sm deleteBtn" data-code="' + data.Code + '">Hapus</button>';

          }
        }
      ]
    })

    let modal = new bootstrap.Modal(document.getElementById('modifierModal'))
    let editMode = false
    let editCode = null

    $('#btnAdd').click(function () {
      editMode = false
      $('#modifierForm')[0].reset()
      $('#Code').prop('disabled', false)
      modal.show()
    })

    $('#modifiersTable').on('click', '.editBtn', function () {
      editMode = true
      editCode = $(this).data('code')
      $.get('/modifiers/data', function (res) {
        let row = res.find(r => r.Code === editCode)
        $('#Code').val(row.Code).prop('disabled', true)
        $('#Kategori').val(row.Kategori)
        $('#Kelompok_Item').val(row.Kelompok_Item)
        modal.show()
      })
    })

    $('#modifiersTable').on('click', '.deleteBtn', function () {
      if (confirm('Hapus data ini?')) {
        let code = $(this).data('code')
        $.ajax({
          url: '/modifiers/delete/' + code,
          type: 'DELETE',
          headers: { 'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content') },
          success: function () { table.ajax.reload() }
        })
      }
    })

    $('#modifierForm').submit(function (e) {
      e.preventDefault()
      let url = editMode ? '/modifiers/update/' + editCode : '/modifiers/store'
      $.ajax({
        url,
        type: 'POST',
        data: $(this).serialize(),
        headers: { 'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content') },
        success: function () {
          modal.hide()
          table.ajax.reload()
        }
      })
    })
  })
</script>
</body>
</html>
